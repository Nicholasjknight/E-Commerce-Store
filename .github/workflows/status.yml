name: Store status

on:
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read public store endpoints
        id: read
        continue-on-error: true
        run: node scripts/status.mjs
      - name: Commit status
        run: |
          git config user.name "knightlogics-status[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md status
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "status: $(date -u +%Y-%m-%d)"
          git push
      - name: Fail when ManCaves.Store health is not ok
        if: steps.read.outcome == 'failure'
        run: exit 1
